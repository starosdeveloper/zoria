name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history (scoring 8.2)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Линтер с типами читает `bot/src` вместе с типами @zoria/* из частного
      # реестра. Без них каждое обращение к движку — «тип не разрешён», и с
      # 04.10 job падал здесь 790 ошибками, не дойдя до остальных шагов. Есть
      # секрет — пакеты бота ставятся и линтится всё; нет — `bot/` выпадает из
      # линтера с названным предупреждением, а не молча.
      - name: пакеты бота для линтера
        id: botdeps
        env:
          ZORIA_NPM_AUTH: ${{ secrets.ZORIA_NPM_AUTH }}
        run: |
          if [ -n "$ZORIA_NPM_AUTH" ]; then
            (cd bot && npm ci --ignore-scripts)
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::нет секрета ZORIA_NPM_AUTH: bot/ не проверен линтером (пакеты @zoria/* в частном реестре)"
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.botdeps.outputs.full == 'true'
        run: pnpm lint
      - if: steps.botdeps.outputs.full != 'true'
        run: pnpm exec eslint . --ignore-pattern 'bot/**'
      - run: pnpm cycles # циклы импорта, K5
      - run: pnpm clones # структурные клоны, K5
      - run: pnpm decisions # карта и ссылки DECISIONS.md против кода, Р1/Р2
      - run: pnpm test
      - run: node apps/watcher/src/main.ts selftest
      - run: pnpm build
      - name: .zoria is still in place (P1-07)
        run: test -s .zoria || (echo "::error::.zoria is missing from the repository root" && exit 1)

  # Бот части 2 — свой npm-пакет вне воркспейса, и P2-01 требует именно
  # `npm ci` в чистом checkout. Пакеты @zoria/* лежат в частном реестре, поэтому
  # job работает только там, где задан секрет ZORIA_NPM_AUTH; без него тихо
  # пропускается, а не падает на чужих форках.
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: нет доступа к реестру — пропустить
        id: gate
        run: echo "go=${{ secrets.ZORIA_NPM_AUTH != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.go == 'true'
        working-directory: bot
        env:
          ZORIA_NPM_AUTH: ${{ secrets.ZORIA_NPM_AUTH }}
        # ровно то, что запустит проверяющий (P2-01), на нижней версии Node из
        # 02-path: `node --test test/` Node 24 читает как модуль, а не каталог,
        # и падал здесь, оставаясь зелёным на Node 26 у нас
        run: |
          npm ci
          npm test
          npx zaria-kit lint nakaz.yaml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
