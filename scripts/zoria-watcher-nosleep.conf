# Drop-in: the watcher holds a sleep lock while it runs, so the machine does not
# suspend through the window. Install before the window, remove after registration:
#   mkdir -p ~/.config/systemd/user/zoria-watcher.service.d
#   cp scripts/zoria-watcher-nosleep.conf ~/.config/systemd/user/zoria-watcher.service.d/nosleep.conf
#   systemctl --user daemon-reload && systemctl --user restart zoria-watcher
# Undo: rm ~/.config/systemd/user/zoria-watcher.service.d/nosleep.conf && systemctl --user daemon-reload && systemctl --user restart zoria-watcher
# Check who holds locks: systemd-inhibit --list
[Service]
ExecStart=
ExecStart=/usr/bin/systemd-inhibit --what=sleep:idle --who=Зоря.нет --why=Просвет можно поймать только не засыпая /usr/bin/env node "%h/Documents/zoria /apps/watcher/src/main.ts" run
