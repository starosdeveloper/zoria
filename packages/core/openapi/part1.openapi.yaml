      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username: &a1
                  type: string
                  pattern: ^[a-z][a-z0-9_-]{2,31}$
                password: &a2
                  type: string
                  minLength: 12
                  maxLength: 256
                  writeOnly: true
                displayName:
                  type: string
                  maxLength: 80
                invitation:
                  type: string
                  maxLength: 100
                  writeOnly: true
                  description: One-time code sent to the applicant by the organizers; 422 invalid-invitation when it is unknown, used or expired
                repositoryUrl:
                  type: string
                  maxLength: 256
                  description: Own repository on GitHub (owner/repo or a github.com address); it must be private - the bot does not join a public repository
                lang:
                  enum:
                    - uk
                    - en
              required:
                - username
                - password
                - displayName
