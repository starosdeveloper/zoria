        - title
        - season
        - registrationOpen
        - inviteRequired
        - repositoryRequired
        - repositoryAccess
        - webClient
    Envelope:
      type: object
      properties:
        frame:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: "#/components/schemas/Frame"
        seal:
          type: string
          pattern: ^[A-Za-z0-9_-]{86}$
        key:
          type: string
          pattern: ^[0-9a-f]{16}$
      required:
        - frame
        - seal
        - key
      description: Sealed ether frame. seal is an Ed25519 signature of the UTF-8 bytes of the frame string, base64url without padding; key is the first 16 hex digits of SHA-256 of the raw public key. Verify before parsing frame.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
          properties:
            code:
              type: string
            field:
              type: string
    EtherKey:
      type: object
      properties:
        algorithm:
          const: Ed25519
        key:
          type: string
          pattern: ^[0-9a-f]{16}$
        publicKey:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - algorithm
        - key
        - publicKey
        - fingerprint
      description: Seal public key. publicKey is the raw 32-byte Ed25519 key in base64url without padding; fingerprint is SHA-256 of those 32 bytes in hex, key its first 16 digits. Compare fingerprint with the task text before trusting the key.
    Frame:
      type: object
      required:
        - v
        - kind
        - station
        - at
        - phase
        - window
        - harbinger
        - fragment
        - onAir
      additionalProperties: true
      properties:
        v:
          const: 1
        kind:
          enum:
            - signal
            - roll
        station:
          const: zoria
        at: *a5
        phase:
          enum:
            - static
            - window
            - after
        window:
          anyOf:
            - type: object
              properties:
                opensAt: *a5
                closesAt: *a5
              required:
                - opensAt
                - closesAt
            - type: "null"
        harbinger:
          anyOf:
            - type: object
              required:
                - opensIn
              properties:
                opensIn:
                  type: integer
                  minimum: 0
                text:
                  type: object
                  properties:
                    uk: *a3
                    en: *a3
                  required:
                    - uk
                    - en
                  description: In-world voice of the harbinger in Ukrainian and Russian; no numbers, only opensIn is mechanics
            - type: "null"
        fragment:
          anyOf:
            - type: object
              properties:
                n:
                  type: integer
                  minimum: 1
                of:
                  type: integer
                  minimum: 1
                text: *a3
              required:
                - n
                - of
                - text
            - type: "null"
        onAir: &a10
          type: integer
          minimum: 0
        roll:
          type: array
          items:
            $ref: "#/components/schemas/RollEntry"
    Message:
      type: object
      properties:
        id: *a6
        messageId:
          type:
            - string
            - "null"
        stageId:
          type:
            - string
            - "null"
        kind:
          enum:
            - message
            - stage
        title: *a3
        body: *a3
        createdAt: *a5
        readAt: &a7
          type:
            - string
            - "null"
          format: date-time
        notice:
          anyOf:
            - $ref: "#/components/schemas/Notice"
            - type: "null"
      required:
        - id
        - messageId
        - stageId
        - kind
        - title
        - body
        - createdAt
        - readAt
        - notice
    News:
      type: object
      properties:
        id: *a6
        title: *a3
        body: *a3
        createdAt: *a5
        updatedAt: *a5
        publishedAt: *a7
        archivedAt: *a7
      required:
        - id
        - title
        - body
        - createdAt
        - updatedAt
        - publishedAt
        - archivedAt
    Notice:
      anyOf:
        - $ref: "#/components/schemas/RepositoryNotice"
        - type: object
          required:
            - type
          properties:
            type: *a3
      description: "Typed notification generated by the hub. In part 1 the type is repository: every change of your repository status. Show an unknown type as a plain message by its title and body."
    Repository:
      type: object
      properties:
        url: *a3
        accessStatus:
          enum:
            - pending
            - verified
            - needs-attention
        checkedAt: *a7
        reason:
          type: &a8
            - string
            - "null"
          description: In the account language; a decision made by the organizer keeps the organizer text
        reasonCode: &a9
          enum:
            - inviter-mismatch
            - marker-found
            - marker-other
            - marker-absent
            - organizer
            - null
          description: "Machine reason: inviter-mismatch (the invitation came from another GitHub account), marker-found (.zoria names this account), marker-other (.zoria names another account), marker-absent (no .zoria yet), organizer (decided by the organizer by hand, reason is the organizer text); null - none"
        updatedAt: *a5
        verifiedElsewhere: *a4
      required:
        - url
        - accessStatus
        - checkedAt
        - reason
        - reasonCode
        - updatedAt
        - verifiedElsewhere
    RepositoryNotice:
      type: object
      properties:
        type:
          const: repository
        url: *a3
        accessStatus:
          enum:
            - pending
            - verified
            - needs-attention
        reason:
          type: *a8
        reasonCode: *a9
      required:
        - type
        - url
        - accessStatus
        - reason
        - reasonCode
    RollEntry:
      type: object
      properties:
        n:
          type: integer
          minimum: 1
        at: *a5
        sinceOpen:
          type: integer
          minimum: 0
        name: *a3
      required:
        - n
        - at
        - sinceOpen
        - name
    Session:
      type: object
      properties:
        token: *a3
        sessionId: *a6
        expiresAt: *a5
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - sessionId
        - expiresAt
        - user
    Stage:
      type: object
      properties:
        id: *a6
        position: *a10
        title: *a3
        body: *a3
        publishedAt: *a5
        releasedAt: *a5
        acknowledgedAt: *a7
        errata:
          type:
            - string
            - "null"
        errataAt: *a7
      required:
        - id
        - position
        - title
        - body
        - publishedAt
        - releasedAt
        - acknowledgedAt
        - errata
        - errataAt
    StageSummary:
      type: object
      properties:
        id: *a6
        position: *a10
        title: *a3
        excerpt: *a3
        publishedAt: *a5
        releasedAt: *a5
        acknowledgedAt: *a7
        errataAt: *a7
      required:
        - id
        - position
        - title
        - excerpt
        - publishedAt
        - releasedAt
        - acknowledgedAt
        - errataAt
    Summary:
      type: object
      properties:
        unread: *a10
        releasedStages: *a10
        acknowledgedStages: *a10
        latestNews: *a7
        repositoryAt: *a7
        serverTime: *a5
      required:
        - unread
        - releasedStages
        - acknowledgedStages
        - latestNews
        - repositoryAt
        - serverTime
      additionalProperties: true
      description: "Cheap poll. repositoryAt moves on every change of your repository or its review: reread /me/repository only then. The server may add fields of later parts; ignore unknown fields."
    User:
      type: object
      properties:
        id: *a6
        username: *a3
        displayName: *a3
        role:
          enum:
            - admin
            - participant
        disabled: *a4
        createdAt: *a5
        lang:
          enum:
            - uk
            - en
          description: "Language of server texts for this account: letters and admission reasons"
      required:
        - id
        - username
        - displayName
        - role
        - disabled
        - createdAt
        - lang
