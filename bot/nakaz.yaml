# жатва — грамота под тот же счёт, что и голова (bot/src/harvest.ts)
#
# Грамота ведёт слот, когда бот молчит шесть тактов или его процесс умер. На
# третьем уровне провокатора это 1237 тактов из 3600 за пакет, так что она не
# формальность: тот же рахунок, только без памяти между тактами.
#
# Порядок правил и есть грамота: сработавшее правило даёт не больше одной
# команды за такт, а правило, которому не хватило байтов, замыкает всё ниже
# себя до следующего такта. Поэтому сверху стоит то, что дороже стоит в
# минутах, а не то, что чаще случается.
#
#  1. hold_net — разрез сети. Погасшая голка это покрытие, уже оплаченное
#     зарядом и тактами: вернуть её на нить дешевле, чем взять новую (7.4).
#  2. зоря — кольцо Ключника гаснет, тянет вдвое (22.4) и берётся за 8 тактов
#     вместо 24. Правило стоит выше роста намеренно: иначе свободного Ткача
#     заберёт правило ниже (05-nakaz, 3).
#  3. замовлення — 30 минут в рахунок (18.4), столько же даёт голка за всю
#     партию: три голки и 12 тактов удержания.
#  4. рой — четыре Ткача это вес 8, вся вилка (10.2). После 800-го такта
#     новый Ткач дорогу уже не окупает.
#  5. шторм — под плямой команда и око стоят вдвое (15.3); не целиться туда,
#     куда пляма придёт через шесть тактов, дешевле, чем платить двойную цену.
#  6. рост по цене земли: луг платит втрое против мілини (А.2), поэтому
#     сначала richest_visible, и только когда богатых руин не осталось —
#     ближний куст. Потолок 80 выбран замером: 24 давало 465.4 рахунку,
#     40 — 553.5, 56 — 626.1, 80 — 636.8, 120 — те же 636.8, то есть выше 80
#     грамота не дорастает и потолок перестаёт что-либо значить. Ставить его
#     ниже — значит в середине партии переключаться с роста на живлення, а
#     Ткач в дороге приносит больше, чем Ткач на голке.
#  7. живлення — последнее из доходного: оно сдвигает покрытие на кольцо
#     наружу (8.5), но держит Ткача на месте, а Ткач в дороге берёт голку.
#  8. спалах — раз в 120 тактов и первым уступает байты: зрение грамоте
#     дешевле покупать голками, чем вухами.
nakaz: 1
name: "жатва"
rules:
  - do: hold_net

  - when: dawn
    do: { extend_to: { target: ring } }

  - when: "contract_open(any)"
    do: { take_contract: { prefer: nearest } }

  - when:
      all:
        - "my_drones < 4"
        - "tick < 800"
    do: { build_drone: { cls: tkach, upto: 4 } }

  - when: "storm_incoming < 6"
    do: { keep_distance: { from: storm, margin: 2 } }

  - when: "my_relays_online < 80"
    do: { extend_to: { target: richest_visible } }

  - when: "my_relays_online < 80"
    do: { extend_to: { target: nearest_cluster } }

  - when: "my_relays_online > 8"
    do: { feed_network: { target: richest_online } }

  - when: "every 120"
    do: { scan_at: { target: densest_contacts, every: 120 } }
    priority: drop-on-budget
